<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B SOFT — Workflow</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- OneSignal -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "e8ba56d2-ff80-4934-90c5-573edda10ab3",
      notifyButton: { enable: false },
      allowLocalhostAsSecureOrigin: true,
    });
  });
</script>
<style>
:root{
  --bg:#0c0c0e;--bg2:#131316;--bg3:#1a1a1f;--bg4:#232329;--bg5:#2c2c34;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#ededf0;--text2:#9999a8;--text3:#55555f;
  --accent:#5b7fff;--accent2:#4a6aee;--accent-glow:rgba(91,127,255,0.13);
  --green:#2dd4a0;--gbg:rgba(45,212,160,0.09);--gbd:rgba(45,212,160,0.25);
  --red:#f06b6b;--rbg:rgba(240,107,107,0.09);--rbd:rgba(240,107,107,0.25);
  --amber:#f5a623;--abg:rgba(245,166,35,0.09);--abd:rgba(245,166,35,0.25);
  --hb:#a78bfa;--hbbg:rgba(167,139,250,0.09);--hbbd:rgba(167,139,250,0.28);
  --ev:#64dcff;--evbg:rgba(100,220,255,0.09);--evbd:rgba(100,220,255,0.25);
  --r:10px;--rs:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6}
input,textarea,select,button{font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}

.lp{display:flex;align-items:center;justify-content:center;height:100vh}
.lbox{width:350px}
.lbrand{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-family:'IBM Plex Mono',monospace;margin-bottom:6px}
.ltitle{font-size:24px;font-weight:600;color:var(--text);margin-bottom:26px;line-height:1.3}
.ltitle span{color:var(--text3)}
.lcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:24px}
.fl{margin-bottom:13px}
.fl label{display:block;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--text3)}
select.fi option{background:var(--bg3)}
.ferr{font-size:12px;color:var(--red);margin-top:5px;min-height:16px}
.lbtn{width:100%;padding:10px;background:var(--accent);border:none;border-radius:var(--rs);color:#fff;font-weight:500;cursor:pointer;margin-top:4px;transition:background .15s}
.lbtn:hover{background:var(--accent2)}

.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:212px;min-width:212px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sb-brand{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-family:'IBM Plex Mono',monospace}
.sb-name{font-size:14px;font-weight:600;color:var(--text);margin-top:2px}
.sb-nav{flex:1;padding:8px 6px;overflow-y:auto}
.ng{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:8px 10px 3px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:transparent;width:100%;text-align:left}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:var(--accent-glow);color:var(--accent)}
.ni.hni.active{background:var(--hbbg);color:var(--hb)}
.ni.hni:hover{background:var(--hbbg);color:var(--hb)}
.ni svg{width:14px;height:14px;flex-shrink:0}
.ni span{font-size:12px;flex:1;text-align:left}
.sbfoot{padding:12px 14px;border-top:1px solid var(--border)}
.urow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.unm{font-size:12px;font-weight:500;color:var(--text)}
.url{font-size:10px;color:var(--text3)}
.nb{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--border);cursor:pointer;margin-bottom:7px;transition:border-color .15s}
.nb:hover{border-color:var(--border2)}
.nd{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:all .3s}
.nd.on{background:var(--green);box-shadow:0 0 0 3px rgba(45,212,160,.18);animation:pd 2s infinite}
@keyframes pd{0%,100%{box-shadow:0 0 0 3px rgba(45,212,160,.18)}50%{box-shadow:0 0 0 6px rgba(45,212,160,.06)}}
.nbl{font-size:11px;color:var(--text2);flex:1}
.nbb{font-size:10px;padding:2px 6px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer}
.lobtn{width:100%;padding:7px;background:transparent;border:1px solid var(--border2);border-radius:var(--rs);color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s}
.lobtn:hover{background:var(--bg3);color:var(--text)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.topbar{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.pgt{font-size:19px;font-weight:600;color:var(--text)}
.pgs{font-size:11px;color:var(--text3);margin-top:2px}
.content{padding:20px 24px;flex:1}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.ct{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.sg{display:grid;gap:10px;margin-bottom:14px}
.sg4{grid-template-columns:repeat(4,1fr)}
.sg3{grid-template-columns:repeat(3,1fr)}
.sg2{grid-template-columns:repeat(2,1fr)}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sv{font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;line-height:1}
.sl{font-size:11px;color:var(--text3);margin-top:4px}
.prog{background:var(--bg5);height:4px;border-radius:2px;margin-top:4px;overflow:hidden}
.pf{height:100%;border-radius:2px;transition:width .4s}
.btn{padding:7px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-size:12px}
.btn:hover{background:var(--bg3);color:var(--text)}
.btnp{background:var(--accent);border-color:var(--accent);color:#fff}
.btnp:hover{background:var(--accent2);border-color:var(--accent2)}
.btnsm{padding:4px 10px;font-size:11px}
.btnd{color:var(--red);border-color:var(--rbd)}
.btnd:hover{background:var(--rbg)}
.btnh{color:var(--hb);border-color:var(--hbbd);background:var(--hbbg)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.bgg{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.bgr{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.bgb{background:var(--accent-glow);color:var(--accent);border-color:rgba(91,127,255,.2)}
.bga{background:var(--abg);color:var(--amber);border-color:var(--abd)}
.bgh{background:var(--hbbg);color:var(--hb);border-color:var(--hbbd)}
.bgev{background:var(--evbg);color:var(--ev);border-color:var(--evbd)}
.tw{overflow-x:auto;overflow-y:auto}
.tw table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;padding:8px 11px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
td{padding:9px 11px;border-bottom:1px solid var(--border);color:var(--text2);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.tdm{color:var(--text);font-weight:500}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{display:block;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.fta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);outline:none;resize:vertical;min-height:80px;transition:border-color .15s;line-height:1.6}
.fta:focus{border-color:var(--accent)}
.fta::placeholder{color:var(--text3)}
.togwrap{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;margin-bottom:10px;transition:border-color .15s;user-select:none}
.togwrap:hover{border-color:var(--border2)}
.tog{width:36px;height:20px;border-radius:10px;background:var(--bg5);position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--accent)}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on::after{transform:translateX(16px)}
.tog.honn{background:var(--hb)}
.toglbl{font-size:12px;color:var(--text);flex:1}
.togsub{font-size:11px;color:var(--text3)}
.hbhdr{display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(167,139,250,.04));border:1px solid var(--hbbd);border-radius:var(--r);margin-bottom:14px}
.hbico{font-size:26px;flex-shrink:0}
.hbttl{font-size:14px;font-weight:600;color:var(--hb)}
.hbsub{font-size:11px;color:var(--text3);margin-top:1px}
.ic{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:10px;transition:border-color .2s}
.ic:hover{border-color:var(--border2)}
.ichb{border-color:var(--hbbd);background:linear-gradient(135deg,var(--bg2),rgba(167,139,250,.04))}
.icmeta{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.icbody{font-size:13px;color:var(--text);line-height:1.7}
.icfoot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.si{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;color:var(--text);outline:none;font-size:12px;transition:border-color .15s}
.si:focus{border-color:var(--accent)}
.si::placeholder{color:var(--text3)}
.pag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.pb{padding:4px 9px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:11px;transition:all .15s}
.pb:hover{background:var(--bg3);color:var(--text)}
.pb.cur{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.pinfo{font-size:10px;color:var(--text3);margin-left:auto;font-family:'IBM Plex Mono',monospace}
.sigwrap{border:1.5px dashed var(--border2);border-radius:var(--rs);background:var(--bg3);position:relative;overflow:hidden;cursor:crosshair}
.sigwrap canvas{display:block;width:100%;height:140px;touch-action:none}
.sigph{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text3);pointer-events:none;white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.sigacts{display:flex;gap:7px;margin-top:7px}
.sth{width:68px;height:26px;border:1px solid var(--border2);border-radius:3px;background:var(--bg3);object-fit:contain;cursor:pointer;vertical-align:middle}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:24px;width:490px;max-width:96vw;max-height:90vh;overflow-y:auto}
.mttl{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.msub{font-size:11px;color:var(--text3);margin-bottom:16px}
.expbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:var(--gbg);border:1px solid var(--gbd);border-radius:var(--rs);color:var(--green);cursor:pointer;font-size:12px;transition:all .15s;font-family:'IBM Plex Sans',sans-serif}
.expbtn:hover{background:rgba(45,212,160,.18)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:10px 16px;font-size:12px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(80px);opacity:0;transition:all .25s;z-index:999;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.tg{border-color:var(--gbd);color:var(--green)}
.th{border-color:var(--hbbd);color:var(--hb)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px;gap:10px}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.sg4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="lp">
<div class="lbox">
  <div class="lbrand">B SOFT LLC</div>
  <div class="ltitle">Нэвтрэх<br><span>системд</span></div>
  <div class="lcard">
    <div class="fl"><label>Нэвтрэх нэр</label><input class="fi" id="lu" type="text" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="fl"><label>Нууц үг</label><input class="fi" id="lp2" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="ferr" id="lerr"></div>
    <button class="lbtn" onclick="doLogin()">Нэвтрэх →</button>
  </div>
</div>
</div>

<!-- APP -->
<div id="appLayout" class="layout" style="display:none">
  <div class="sidebar">
    <div class="sb-logo"><div class="sb-brand">B SOFT LLC</div><div class="sb-name">Workflow</div></div>
    <nav class="sb-nav" id="sideNav"></nav>
    <div class="sbfoot">
      <div class="urow">
        <div class="av" id="uAv">--</div>
        <div><div class="unm" id="uNm">--</div><div class="url" id="uRl">--</div></div>
      </div>
      <div class="nb" id="notifBar" onclick="toggleNotif()">
        <div class="nd" id="nDot"></div>
        <span class="nbl" id="nLbl">Notification унтарсан</span>
        <button class="nbb" id="nBtn">Асаах</button>
      </div>
      <button class="lobtn" onclick="doLogout()">← Гарах</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar"><div><div class="pgt" id="pgT">—</div><div class="pgs" id="pgS">—</div></div></div>
    <div class="content" id="CA"></div>
  </div>
</div>

<!-- SIG MODAL -->
<div class="overlay" id="sigModal">
  <div class="modal">
    <div class="mttl">Гарын үсэг зурах</div>
    <div class="msub" id="sigSub"></div>
    <div class="sigwrap" id="sigWrap"><canvas id="sigCanvas"></canvas><div class="sigph" id="sigPh">Энд гарын үсэг зурна уу...</div></div>
    <div class="sigacts">
      <button class="btn btnsm" onclick="clearSig()">Арилгах</button>
      <div style="flex:1"></div>
      <button class="btn btnsm" onclick="closeSig()">Болих</button>
      <button class="btn btnp btnsm" onclick="confirmSig()">✔ Баталгаажуулах</button>
    </div>
  </div>
</div>

<!-- SIG VIEW -->
<div class="overlay" id="sigVM">
  <div class="modal" style="width:360px">
    <div class="mttl" id="svT">Гарын үсэг</div>
    <div style="margin-top:10px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg3);padding:8px;text-align:center"><img id="svI" src="" style="max-width:100%;height:auto;display:block;margin:0 auto"></div>
    <div style="margin-top:10px;display:flex;justify-content:flex-end"><button class="btn btnsm" onclick="closeSV()">Хаах</button></div>
  </div>
</div>

<!-- EDIT INSTR MODAL -->
<div class="overlay" id="eiModal">
  <div class="modal">
    <div class="mttl">Заавар засах</div>
    <div class="msub">Агуулга, огноо, горимыг өөрчлөх боломжтой</div>
    <input type="hidden" id="eiId">
    <div class="fr2" style="margin-bottom:10px">
      <div><label class="lbl">Төрөл</label>
        <select class="fi" id="eiType">
          <option value="general">Ерөнхий заавар</option>
          <option value="habea">🔷 HABEA заавар</option>
          <option value="urgent">🚨 Яаралтай</option>
        </select></div>
      <div><label class="lbl">Давтамж</label>
        <select class="fi" id="eiMode" onchange="eiModeChg()">
          <option value="once">Нэг удаа</option>
          <option value="every">Өдөр бүр</option>
        </select></div>
    </div>
    <div id="eiDW" style="margin-bottom:10px"><label class="lbl">Огноо</label><input class="fi" id="eiDate" type="date" style="width:100%"></div>
    <div style="margin-bottom:10px">
      <label class="lbl">Хэнд илгээх</label>
      <div id="eiTargBox" style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px">
          <input type="checkbox" id="eiTargAll" onchange="eiTargAllChg()" style="accent-color:var(--accent);width:14px;height:14px;cursor:pointer">
          <span style="font-size:12px;font-weight:600;color:var(--text)">Бүх ажилтан</span>
        </label>
        <div id="eiTargList" style="max-height:140px;overflow-y:auto"></div>
      </div>
    </div>
    <div style="margin-bottom:14px"><label class="lbl">Агуулга</label><textarea class="fta" id="eiText" style="min-height:90px"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btnsm" onclick="closeEI()">Болих</button>
      <button class="btn btnp btnsm" onclick="saveEI()">Хадгалах</button>
    </div>
  </div>
</div>

<!-- EDIT USER MODAL -->
<div class="overlay" id="euModal">
  <div class="modal" style="width:380px">
    <div class="mttl">Хэрэглэгч засах</div><div class="msub"></div>
    <input type="hidden" id="euId">
    <div style="margin-bottom:9px"><label class="lbl">Бүтэн нэр</label><input class="fi" id="euNm" type="text"></div>
    <div style="margin-bottom:9px"><label class="lbl">Нэвтрэх нэр</label><input class="fi" id="euUsr" type="text" autocomplete="off"></div>
    <div style="margin-bottom:9px"><label class="lbl">Шинэ нууц үг <span style="font-weight:400;font-size:10px">(хоосон = өөрчлөгдөхгүй)</span></label><input class="fi" id="euPw" type="text" autocomplete="off"></div>
    <div style="margin-bottom:9px"><label class="lbl">Мэргэжил / Албан тушаал</label><input class="fi" id="euProf" type="text"></div>
    <div style="margin-bottom:9px"><label class="lbl">Утасны дугаар</label><input class="fi" id="euPhone" type="tel"></div>
    <div style="margin-bottom:14px"><label class="lbl">Эрх</label><select class="fi" id="euRl"><option value="worker">Ажилтан</option><option value="admin">Админ</option></select></div>
    <div class="ferr" id="euErr"></div>

function targAllChg(){
  const allCb=document.getElementById('targAll');
  const list=document.getElementById('targList');
  const sum=document.getElementById('targSummary');
  list.style.display=allCb.checked?'none':'block';
  sum.style.display=allCb.checked?'none':'block';
  if(allCb.checked){document.querySelectorAll('.targCb').forEach(c=>c.checked=false);sum.textContent='';}
}
function targCbChg(){
  const checked=[...document.querySelectorAll('.targCb:checked')];
  const allCb=document.getElementById('targAll');
  if(checked.length===0){allCb.checked=true;targAllChg();return;}
  allCb.checked=false;
  const ws=workers();
  const names=checked.map(c=>ws.find(w=>w.id===Number(c.value))?.name||'').filter(Boolean);
  const sum=document.getElementById('targSummary');
  sum.style.display='block';sum.textContent='Сонгогдсон: '+names.join(', ');
}
function getTargets(){
  const allCb=document.getElementById('targAll');
  if(!allCb||allCb.checked) return 'all';
  const checked=[...document.querySelectorAll('.targCb:checked')].map(c=>Number(c.value));
  return checked.length===0?'all':checked;
}
function toggleEv(){
  everyOn=!everyOn;
  const sw=document.getElementById('evSw'),sub=document.getElementById('evSub'),dw=document.getElementById('nDateW');
  if(everyOn){sw.classList.add('on','honn');sub.textContent='Идэвхтэй — өдөр бүр бүх ажилтанд харагдана';dw.style.display='none';}
  else{sw.classList.remove('on','honn');sub.textContent='Унтарсан — нэг удааны огноо сонгоно';dw.style.display='block';}
}

async function addInstr(){
  const txt=document.getElementById('nText').value.trim();
  const dt=everyOn?null:document.getElementById('nDate').value;
  const type=document.getElementById('nType').value;
  const targets=getTargets();
  if(!txt){showToast('Зааврын агуулга хоосон байна!');return;}
  if(!everyOn&&!dt){showToast('Огноо сонгоно уу!');return;}
  const {data,error}=await sb.from('instructions').insert({
    date:dt, everyday:everyOn, type, text:txt,
    targets:targets==='all'?'all':JSON.stringify(targets),
    created_by:CU.id
  }).select().single();
  if(error){showToast('Алдаа гарлаа: '+error.message);return;}
  everyOn=false;
  // OneSignal push notification
  await sendPushToAll(`📋 Шинэ ${tLabel(type)} заавар`, txt.slice(0,80));
  showToast('Заавар нийтлэгдлээ! Мэдэгдэл илгээгдлээ.',type==='habea'?'h':'g');
  navigate('add-instr');
}

async function delInstr(id){
  if(!confirm('Энэ зааврыг устгах уу?'))return;
  await sb.from('acknowledgements').delete().eq('instruction_id',id);
  await sb.from('instructions').delete().eq('id',id);
  showToast('Устгагдлаа');
  navigate(document.querySelector('.ni.active')?.id?.replace('nav-','')||'add-instr');
}

// EDIT INSTR
function eiTargAllChg(){
  const allCb=document.getElementById('eiTargAll');
  const list=document.getElementById('eiTargList');
  list.style.opacity=allCb.checked?'.4':'1';
  list.style.pointerEvents=allCb.checked?'none':'auto';
  if(allCb.checked) document.querySelectorAll('.eiTargCb').forEach(c=>c.checked=false);
}
function getEiTargets(){
  const allCb=document.getElementById('eiTargAll');
  if(!allCb||allCb.checked) return 'all';
  const checked=[...document.querySelectorAll('.eiTargCb:checked')].map(c=>Number(c.value));
  return checked.length===0?'all':checked;
}
function eiModeChg(){document.getElementById('eiDW').style.display=document.getElementById('eiMode').value==='every'?'none':'block';}
function openEI(id){
  const i=INSTRS.find(x=>x.id===id);if(!i)return;
  const ws=workers();
  document.getElementById('eiId').value=id;
  document.getElementById('eiType').value=i.type||'general';
  document.getElementById('eiMode').value=i.everyday?'every':'once';
  document.getElementById('eiDate').value=i.date||today();
  document.getElementById('eiText').value=i.text;
  const list=document.getElementById('eiTargList');
  list.innerHTML=ws.map(w=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0">
    <input type="checkbox" class="eiTargCb" value="${w.id}" style="accent-color:var(--accent);width:13px;height:13px;cursor:pointer">
    <span style="font-size:12px;color:var(--text)">${w.name}</span>
    ${w.profession?`<span style="font-size:10px;color:var(--text3)">· ${w.profession}</span>`:''}
  </label>`).join('');
  const allCb=document.getElementById('eiTargAll');
  const t=i.targets;
  if(!t||t==='all'){allCb.checked=true;list.style.opacity='.4';list.style.pointerEvents='none';}
  else{
    allCb.checked=false;list.style.opacity='1';list.style.pointerEvents='auto';
    const arr=Array.isArray(t)?t:(typeof t==='string'?JSON.parse(t):[]);
    document.querySelectorAll('.eiTargCb').forEach(c=>{c.checked=arr.includes(Number(c.value));});
  }
  eiModeChg();
  document.getElementById('eiModal').classList.add('open');
}
function closeEI(){document.getElementById('eiModal').classList.remove('open');}
async function saveEI(){
  const id=Number(document.getElementById('eiId').value);
  const type=document.getElementById('eiType').value;
  const every=document.getElementById('eiMode').value==='every';
  const dt=every?null:document.getElementById('eiDate').value;
  const txt=document.getElementById('eiText').value.trim();
  const targets=getEiTargets();
  if(!txt){showToast('Агуулга хоосон байна!');return;}
  const {error}=await sb.from('instructions').update({
    type, everyday:every, date:dt, text:txt,
    targets:targets==='all'?'all':JSON.stringify(targets)
  }).eq('id',id);
  if(error){showToast('Алдаа: '+error.message);return;}
  closeEI();showToast('Хадгалагдлаа!',type==='habea'?'h':'g');
  navigate(document.querySelector('.ni.active')?.id?.replace('nav-','')||'add-instr');
}

let sigCanvas,sigCtx,isDrawing=false,hasSig=false,lastX=0,lastY=0;
function openSigM(id){
  pendingSigId=id;
  const i=INSTRS.find(x=>x.id===id);
  document.getElementById('sigSub').textContent=i?`"${i.text.slice(0,60)}${i.text.length>60?'…':''}"`:'' ;
  document.getElementById('sigModal').classList.add('open');
  setTimeout(initSP,50);
}
function initSP(){
  sigCanvas=document.getElementById('sigCanvas');
  const wrap=document.getElementById('sigWrap');
  sigCanvas.width=wrap.clientWidth;sigCanvas.height=140;
  sigCtx=sigCanvas.getContext('2d');
  sigCtx.strokeStyle='#ededf0';sigCtx.lineWidth=2;sigCtx.lineCap='round';sigCtx.lineJoin='round';
  hasSig=false;document.getElementById('sigPh').style.display='block';
  sigCanvas.onmousedown=e=>{isDrawing=true;[lastX,lastY]=gp(e);};
  sigCanvas.onmousemove=e=>{if(!isDrawing)return;dr(e);};
  sigCanvas.onmouseup=()=>{isDrawing=false;sigCtx.beginPath();};
  sigCanvas.onmouseleave=()=>{isDrawing=false;sigCtx.beginPath();};
  sigCanvas.ontouchstart=e=>{e.preventDefault();isDrawing=true;[lastX,lastY]=gp(e.touches[0]);};
  sigCanvas.ontouchmove=e=>{e.preventDefault();if(!isDrawing)return;dr(e.touches[0]);};
  sigCanvas.ontouchend=()=>{isDrawing=false;sigCtx.beginPath();};
}
function gp(e){const r=sigCanvas.getBoundingClientRect();return[(e.clientX-r.left)*(sigCanvas.width/r.width),(e.clientY-r.top)*(sigCanvas.height/r.height)];}
function dr(e){const [x,y]=gp(e);sigCtx.beginPath();sigCtx.moveTo(lastX,lastY);sigCtx.lineTo(x,y);sigCtx.stroke();[lastX,lastY]=[x,y];if(!hasSig){hasSig=true;document.getElementById('sigPh').style.display='none';}}
function clearSig(){if(!sigCtx)return;sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);hasSig=false;document.getElementById('sigPh').style.display='block';}
function closeSig(){document.getElementById('sigModal').classList.remove('open');pendingSigId=null;}
async function confirmSig(){
  if(!hasSig){showToast('Гарын үсэг зурна уу!');return;}
  const sig=sigCanvas.toDataURL('image/png');
  const i=INSTRS.find(x=>x.id===pendingSigId);if(!i){closeSig();return;}
  const {error}=await sb.from('acknowledgements').upsert({
    instruction_id:i.id,
    user_id:CU.id,
    ack_date:today(),
    sig,
    signed_at:new Date().toISOString()
  },{onConflict:'instruction_id,user_id,ack_date'});
  if(error){showToast('Алдаа: '+error.message);return;}
  closeSig();showToast('Амжилттай баталгаажуулав!','g');
  navigate(document.querySelector('.ni.active')?.id?.replace('nav-','')||'today');
}
function viewSig(src,name){document.getElementById('svT').textContent=name+' — гарын үсэг';document.getElementById('svI').src=src;document.getElementById('sigVM').classList.add('open');}

  ['sigVM','sigModal','eiModal','euModal'].forEach(id=>{if(e.target===document.getElementById(id))document.getElementById(id).classList.remove('open');});
});

  const wb=XLSX.utils.book_new();
  [[det,'Дэлгэрэнгүй жагсаалт',7],[hdet,'HABEA тайлан',5],[wsum,'Ажилтан хураангуй',10]].forEach(([data,name,cols])=>{
    const sh=XLSX.utils.aoa_to_sheet(data);stX(sh,data.length,cols);
    sh['!cols']=Array(cols).fill({wch:14});if(sh['!cols'][3])sh['!cols'][3]={wch:40};

  });

function stX(ws,rows,cols){
  const L='ABCDEFGHIJ'.split('');
  for(let c=0;c<cols;c++){const a=L[c]+'1';if(!ws[a])continue;ws[a].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1E3A8A'}},alignment:{horizontal:'center'}};}
  for(let r=2;r<=rows;r++)for(let c=0;c<cols;c++){const a=L[c]+r;if(!ws[a])continue;ws[a].s={fill:{fgColor:{rgb:r%2===0?'EFF6FF':'FFFFFF'}},alignment:{wrapText:true}};}
}

function pagCtrl(cur,total,varName,page,tot){
  if(total<=1)return '';
  const w=Math.min(total,7);let s=Math.max(1,cur-3),e=Math.min(total,s+w-1);
  if(e-s<w-1)s=Math.max(1,e-w+1);
  let b='';
  if(s>1)b+=`<button class="pb" onclick="${varName}=1;navigate('${page}')">1</button>${s>2?'<span style="color:var(--text3);font-size:10px;padding:0 2px">…</span>':''}`;
  for(let p=s;p<=e;p++)b+=`<button class="pb${p===cur?' cur':''}" onclick="${varName}=${p};navigate('${page}')">${p}</button>`;
  if(e<total)b+=`${e<total-1?'<span style="color:var(--text3);font-size:10px;padding:0 2px">…</span>':''}<button class="pb" onclick="${varName}=${total};navigate('${page}')">${total}</button>`;
  return `<div class="pag">
    ${cur>1?`<button class="pb" onclick="${varName}=${cur-1};navigate('${page}')">←</button>`:''}
    ${b}
    ${cur<total?`<button class="pb" onclick="${varName}=${cur+1};navigate('${page}')">→</button>`:''}
    <span class="pinfo">${(cur-1)*WPP+1}–${Math.min(cur*WPP,tot)} / ${tot}</span>
  </div>`;
}
