<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>B SOFT — Workflow</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0c0c0e;--bg2:#131316;--bg3:#1a1a1f;--bg4:#232329;--bg5:#2c2c34;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#ededf0;--text2:#9999a8;--text3:#55555f;
  --accent:#5b7fff;--accent2:#4a6aee;--accent-glow:rgba(91,127,255,0.13);
  --green:#2dd4a0;--gbg:rgba(45,212,160,0.09);--gbd:rgba(45,212,160,0.25);
  --red:#f06b6b;--rbg:rgba(240,107,107,0.09);--rbd:rgba(240,107,107,0.25);
  --amber:#f5a623;--abg:rgba(245,166,35,0.09);--abd:rgba(245,166,35,0.25);
  --hb:#a78bfa;--hbbg:rgba(167,139,250,0.09);--hbbd:rgba(167,139,250,0.28);
  --ev:#64dcff;--evbg:rgba(100,220,255,0.09);--evbd:rgba(100,220,255,0.25);
  --r:10px;--rs:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6;-webkit-tap-highlight-color:transparent}
input,textarea,select,button{font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}

/* LOGIN — mobile-first redesign */
.lp{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 20px;
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(91,127,255,.12) 0%,transparent 68%);
}
.lbox{width:380px;max-width:100%}
.lbrand{
  font-size:11px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);
  font-family:'IBM Plex Mono',monospace;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.lbrand::before{content:'';display:inline-block;width:20px;height:2px;background:var(--accent);border-radius:2px}
.ltitle{font-size:30px;font-weight:600;color:var(--text);margin-bottom:28px;line-height:1.2;letter-spacing:-.02em}
.ltitle span{color:var(--text3);font-weight:300}
.lcard{background:var(--bg2);border:1.5px solid var(--border2);border-radius:16px;padding:28px;box-shadow:0 32px 64px rgba(0,0,0,.5)}
.fl{margin-bottom:18px}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.fi{
  width:100%;background:var(--bg3);border:1.5px solid var(--border);
  border-radius:10px;padding:13px 16px;color:var(--text);outline:none;
  transition:border-color .18s,box-shadow .18s;font-size:15px;
}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,127,255,.13)}
.fi::placeholder{color:var(--text3)}
select.fi option{background:var(--bg3)}
.ferr{font-size:13px;color:var(--red);margin:6px 0 0;min-height:18px;text-align:center}
.lbtn{
  width:100%;padding:14px;background:var(--accent);border:none;
  border-radius:10px;color:#fff;font-weight:600;font-size:15px;
  cursor:pointer;margin-top:8px;transition:background .15s,transform .1s;
  letter-spacing:.02em;
}
.lbtn:hover{background:var(--accent2)}
.lbtn:active{transform:scale(.98)}

/* LAYOUT */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid var(--border)}
.sb-brand{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-family:'IBM Plex Mono',monospace}
.sb-name{font-size:15px;font-weight:600;color:var(--text);margin-top:3px;letter-spacing:-.01em}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.ng{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 4px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:transparent;width:100%;text-align:left}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:var(--accent-glow);color:var(--accent)}
.ni.hni.active{background:var(--hbbg);color:var(--hb)}
.ni.hni:hover{background:var(--hbbg);color:var(--hb)}
.ni svg{width:15px;height:15px;flex-shrink:0}
.ni span{font-size:13px;flex:1;text-align:left;font-weight:500}
.sbfoot{padding:14px 16px;border-top:1px solid var(--border)}
.urow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.unm{font-size:13px;font-weight:600;color:var(--text)}
.url{font-size:11px;color:var(--text3);margin-top:1px}
.lobtn{width:100%;padding:8px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s}
.lobtn:hover{background:var(--bg3);color:var(--text)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0;-webkit-overflow-scrolling:touch}
.topbar{padding:22px 26px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.pgt{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.pgs{font-size:12px;color:var(--text3);margin-top:3px}
.content{padding:20px 26px;flex:1}

/* CARDS & COMMON */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.ct{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.sg{display:grid;gap:10px;margin-bottom:14px}
.sg4{grid-template-columns:repeat(4,1fr)}
.sg3{grid-template-columns:repeat(3,1fr)}
.sg2{grid-template-columns:repeat(2,1fr)}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sv{font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;line-height:1}
.sl{font-size:11px;color:var(--text3);margin-top:4px}
.prog{background:var(--bg5);height:4px;border-radius:2px;margin-top:4px;overflow:hidden}
.pf{height:100%;border-radius:2px;transition:width .4s}
.btn{padding:7px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-size:12px}
.btn:hover{background:var(--bg3);color:var(--text)}
.btnp{background:var(--accent);border-color:var(--accent);color:#fff}
.btnp:hover{background:var(--accent2);border-color:var(--accent2)}
.btnsm{padding:4px 10px;font-size:11px}
.btnd{color:var(--red);border-color:var(--rbd)}
.btnd:hover{background:var(--rbg)}
.btnh{color:var(--hb);border-color:var(--hbbd);background:var(--hbbg)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.bgg{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.bgr{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.bgb{background:var(--accent-glow);color:var(--accent);border-color:rgba(91,127,255,.2)}
.bga{background:var(--abg);color:var(--amber);border-color:var(--abd)}
.bgh{background:var(--hbbg);color:var(--hb);border-color:var(--hbbd)}
.bgev{background:var(--evbg);color:var(--ev);border-color:var(--evbd)}
.tw{overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tw table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;padding:8px 11px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
td{padding:9px 11px;border-bottom:1px solid var(--border);color:var(--text2);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.tdm{color:var(--text);font-weight:500}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{display:block;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.fta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);outline:none;resize:vertical;min-height:80px;transition:border-color .15s;line-height:1.6}
.fta:focus{border-color:var(--accent)}
.fta::placeholder{color:var(--text3)}
.togwrap{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;margin-bottom:10px;transition:border-color .15s;user-select:none}
.togwrap:hover{border-color:var(--border2)}
.tog{width:36px;height:20px;border-radius:10px;background:var(--bg5);position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--accent)}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on::after{transform:translateX(16px)}
.tog.honn{background:var(--hb)}
.toglbl{font-size:12px;color:var(--text);flex:1}
.togsub{font-size:11px;color:var(--text3)}
.hbhdr{display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(167,139,250,.04));border:1px solid var(--hbbd);border-radius:var(--r);margin-bottom:14px}
.hbico{font-size:26px;flex-shrink:0}
.hbttl{font-size:14px;font-weight:600;color:var(--hb)}
.hbsub{font-size:11px;color:var(--text3);margin-top:1px}
.ic{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:10px;transition:border-color .2s}
.ic:hover{border-color:var(--border2)}
.ichb{border-color:var(--hbbd);background:linear-gradient(135deg,var(--bg2),rgba(167,139,250,.04))}
.icur{border-color:var(--rbd);background:linear-gradient(135deg,var(--bg2),rgba(240,107,107,.04))}
.icmeta{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.icbody{font-size:13px;color:var(--text);line-height:1.7}
.icfoot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.si{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;color:var(--text);outline:none;font-size:12px;transition:border-color .15s}
.si:focus{border-color:var(--accent)}
.si::placeholder{color:var(--text3)}
.pag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.pb{padding:4px 9px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:11px;transition:all .15s}
.pb:hover{background:var(--bg3);color:var(--text)}
.pb.cur{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.pinfo{font-size:10px;color:var(--text3);margin-left:auto;font-family:'IBM Plex Mono',monospace}
.sigwrap{border:1.5px dashed var(--border2);border-radius:var(--rs);background:var(--bg3);position:relative;overflow:hidden;cursor:crosshair}
.sigwrap canvas{display:block;width:100%;height:140px;touch-action:none}
.sigph{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text3);pointer-events:none;white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.sigacts{display:flex;gap:7px;margin-top:7px}
.sth{width:68px;height:26px;border:1px solid var(--border2);border-radius:3px;background:var(--bg3);object-fit:contain;cursor:pointer;vertical-align:middle}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:24px;width:490px;max-width:100%;max-height:90vh;overflow-y:auto}
.mttl{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.msub{font-size:11px;color:var(--text3);margin-bottom:16px}
.expbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:var(--gbg);border:1px solid var(--gbd);border-radius:var(--rs);color:var(--green);cursor:pointer;font-size:12px;transition:all .15s;font-family:'IBM Plex Sans',sans-serif}
.expbtn:hover{background:rgba(45,212,160,.18)}
.toast{position:fixed;bottom:20px;right:20px;left:20px;max-width:340px;margin:0 auto;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:10px 16px;font-size:12px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(80px);opacity:0;transition:all .25s;z-index:999;pointer-events:none;text-align:center}
@media(min-width:480px){.toast{right:20px;left:auto;margin:0;text-align:left}}
.toast.show{transform:translateY(0);opacity:1}
.tg{border-color:var(--gbd);color:var(--green)}
.th{border-color:var(--hbbd);color:var(--hb)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px;gap:10px}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* WORKER — mobile-optimized cards */
.wcard-ack-btn{
  width:100%;padding:16px 18px;
  background:linear-gradient(135deg,var(--bg3),var(--bg4));
  border:1.5px solid var(--border2);
  border-radius:10px;color:var(--text);
  cursor:pointer;font-size:15px;font-weight:500;
  transition:all .18s;font-family:'IBM Plex Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:10px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  letter-spacing:.01em;
}
.wcard-ack-btn:hover,.wcard-ack-btn:active{
  background:var(--gbg);border-color:var(--green);color:var(--green);
  transform:scale(.99);
}

/* Worker instruction card */
.wic{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:12px;padding:18px 16px;
  margin-bottom:12px;transition:border-color .2s;
}
.wic:hover{border-color:var(--border2)}
.wic-habea{border-color:rgba(167,139,250,.35);background:linear-gradient(135deg,var(--bg2),rgba(167,139,250,.04))}
.wic-urgent{border-color:rgba(240,107,107,.35);background:linear-gradient(135deg,var(--bg2),rgba(240,107,107,.04))}
.wic-done{border-color:rgba(45,212,160,.25);background:linear-gradient(135deg,var(--bg2),rgba(45,212,160,.03))}

.wic-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.wic-dot{
  width:10px;height:10px;border-radius:50%;
  flex-shrink:0;margin-top:5px;
}
.wic-dot-g{background:var(--accent)}
.wic-dot-h{background:var(--hb)}
.wic-dot-u{background:var(--red)}
.wic-dot-done{background:var(--green)}

.wic-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.wic-body{font-size:15px;color:var(--text);line-height:1.7;letter-spacing:.005em}
.wic-foot{margin-top:14px}

.wic-done-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:var(--gbg);border:1px solid var(--gbd);
  border-radius:8px;
}
.wic-done-txt{font-size:13px;color:var(--green);font-weight:600;flex:1}
.wic-done-time{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace}

/* Worker section headers */
.wsec-hdr{
  display:flex;align-items:center;gap:8px;
  padding:8px 0 10px;margin-bottom:4px;
}
.wsec-line{flex:1;height:1px;background:var(--border)}
.wsec-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}

/* History items */
.whist-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.whist-icon{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;margin-top:1px;
}
.whist-icon-done{background:var(--gbg);color:var(--green)}
.whist-icon-miss{background:var(--rbg);color:var(--red)}
.whist-content{flex:1;min-width:0}
.whist-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:4px}
.whist-text{font-size:14px;color:var(--text);line-height:1.6}
.whist-status{font-size:11px;margin-top:5px;font-weight:500}

/* Worker unread alert */
.w-alert{
  display:flex;align-items:flex-start;gap:12px;
  background:linear-gradient(135deg,rgba(245,166,35,.1),rgba(245,166,35,.04));
  border:1.5px solid var(--abd);border-radius:12px;
  padding:14px 16px;margin-bottom:16px;
}
.w-alert-ico{font-size:22px;flex-shrink:0;margin-top:1px}
.w-alert-title{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:3px}
.w-alert-sub{font-size:12px;color:var(--text2);line-height:1.5}

/* Stat cards for worker */
.wstat{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:12px;padding:16px;text-align:center;
}
.wstat-v{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1.1;margin-bottom:4px}
.wstat-l{font-size:11px;color:var(--text3);font-weight:500}

/* RESPONSIVE */
@media(max-width:900px){.sg4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
  .layout{flex-direction:column;height:100dvh}
  .sidebar{
    width:100%;min-width:unset;height:auto;
    border-right:none;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .sb-logo{
    padding:14px 16px 12px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .sb-logo .sb-name{display:none}
  .sb-nav{
    display:flex;flex-wrap:nowrap;
    overflow-x:auto;padding:8px 10px;gap:6px;
    border-top:1px solid var(--border);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .sb-nav::-webkit-scrollbar{display:none}
  .ng{display:none}
  .ni{
    flex-direction:column;gap:4px;
    padding:10px 14px;min-width:64px;
    flex-shrink:0;border-radius:10px;
  }
  .ni span{font-size:10px;text-align:center;white-space:nowrap;font-weight:600}
  .ni svg{width:20px;height:20px}
  .ni.active{background:var(--accent-glow)}
  .sbfoot{display:none}
  .main{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
  .topbar{padding:16px 16px 0}
  .pgt{font-size:18px}
  .pgs{font-size:11px}
  .content{padding:14px 16px 32px}
  .sg4,.sg3{grid-template-columns:repeat(2,1fr)}
  .sg2,.fr2{grid-template-columns:1fr}
  .modal{width:100%!important;max-width:100%!important;padding:18px}
  .lbox{width:100%}
  .card{padding:14px}
  th,td{padding:8px 9px;font-size:11px}
  .ic{padding:14px}
  .wic{padding:16px 14px}
  .wic-body{font-size:14px}
  .wcard-ack-btn{padding:18px;font-size:15px}
  .whist-item{padding:13px 0;gap:12px}
  .whist-text{font-size:13px}
  /* worker stat row */
  .wstat{padding:14px 10px}
  .wstat-v{font-size:24px}
}
@media(max-width:400px){
  .sg4,.sg3,.sg2{grid-template-columns:repeat(2,1fr)}
  .sv{font-size:20px}

// MIDNIGHT AUTO-REFRESH (шөнийн 00:00 цагт шинэчлэгдэх)
// ============================================================
function scheduleMidnightRefresh(){
  const now=new Date();
  const tomorrow=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,5); // 00:00:05
  const ms=tomorrow-now;
  setTimeout(async()=>{
    if(CU){
      await loadAll();
      const activePage=document.querySelector('.ni.active')?.id?.replace('nav-','');
      if(activePage) navigate(activePage);
      showToast('Шинэ өдөр эхэллээ — '+today(),'g');
    }
    scheduleMidnightRefresh(); // дараагийн өдрийг schedule хийх
  },ms);
}

function today(){
  // UTC биш — local цагаар өдрийн огноо (Монгол UTC+8 зөв ажиллана)
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function nowTime(){return new Date().toLocaleTimeString('mn-MN',{hour:'2-digit',minute:'2-digit'});}
function nowDT(){return new Date().toLocaleString('mn-MN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function workers(){return USERS.filter(u=>u.role==='worker');}
// Идэвхтэй ажилтан — амралтаас хасах (заавар тооцоо, poss тооцоонд)
function activeWorkers(){return USERS.filter(u=>u.role==='worker'&&!u.on_leave);}
function tLabel(t){return{general:'Ерөнхий',habea:'HABEA',urgent:'Яаралтай'}[t]||'Ерөнхий';}
function tBadge(t,ev){
  let b=t==='habea'?'<span class="badge bgh">🔷 HABEA</span>':t==='urgent'?'<span class="badge bgr">🚨 Яаралтай</span>':'<span class="badge bgb">Ерөнхий</span>';
  if(ev) b+=' <span class="badge bgev">🔄 Өдөр бүр</span>';
  return b;
}
function activeToday(i){return i.everyday||(i.date===today());}
function isOnLeave(uid){const u=USERS.find(x=>x.id===Number(uid));return !!(u&&u.on_leave);}
function targMatch(i,uid){
  if(isOnLeave(uid)) return false;
  const t=i.targets;
  if(t==='all'||t===null||t===undefined) return true;
  const arr=Array.isArray(t)?t:(typeof t==='string'?JSON.parse(t):t);
  if(arr==='all') return true;
  return Array.isArray(arr)&&arr.includes(Number(uid));
}
function targLabel(i){
  const t=i.targets;
  if(!t||t==='all') return '<span class="badge bgb" style="font-size:9px">Бүх ажилтан</span>';
  const arr=Array.isArray(t)?t:(typeof t==='string'?JSON.parse(t):t);
  if(arr==='all'||!Array.isArray(arr)) return '<span class="badge bgb" style="font-size:9px">Бүх ажилтан</span>';
  const ws=workers();
  const names=arr.map(id=>ws.find(w=>w.id===id)?.name||'').filter(Boolean);
  if(names.length===0) return '<span class="badge bgb" style="font-size:9px">Бүх ажилтан</span>';
  if(names.length<=3) return names.map(n=>`<span class="badge bga" style="font-size:9px">${n}</span>`).join(' ');
  return `<span class="badge bga" style="font-size:9px">${names.slice(0,2).join(', ')} +${names.length-2}</span>`;
}
function getAck(instr,uid,forDate){
  const date=forDate||today();
  if(instr.everyday) return ACKS.find(a=>a.instruction_id===instr.id&&a.user_id===Number(uid)&&a.ack_date===date)||null;
  return ACKS.find(a=>a.instruction_id===instr.id&&a.user_id===Number(uid))||null;
}
function getAckHistory(instr,uid){
  return ACKS.filter(a=>a.instruction_id===instr.id&&a.user_id===Number(uid)).sort((a,b)=>b.ack_date.localeCompare(a.ack_date));
}

async function toggleLeave(uid){
  const u=USERS.find(x=>x.id===uid);if(!u)return;
  const newVal=!u.on_leave;
  const{error}=await sb.from('users').update({on_leave:newVal}).eq('id',uid);

  showToast(u.name+(newVal?' — амралтад орлоо 😴':' — ажилдаа ирлээ ✔'),newVal?'':'g');

function targAllChg(){
  const allCb=document.getElementById('targAll');
  const list=document.getElementById('targList');
  const sum=document.getElementById('targSummary');
  list.style.display=allCb.checked?'none':'block';
  sum.style.display=allCb.checked?'none':'block';
  if(allCb.checked){document.querySelectorAll('.targCb').forEach(c=>c.checked=false);sum.textContent='';}
}
function targCbChg(){
  const checked=[...document.querySelectorAll('.targCb:checked')];
  const allCb=document.getElementById('targAll');
  if(checked.length===0){allCb.checked=true;targAllChg();return;}
  allCb.checked=false;
  const ws=workers();
  const names=checked.map(c=>ws.find(w=>w.id===Number(c.value))?.name||'').filter(Boolean);
  const sum=document.getElementById('targSummary');
  sum.style.display='block';sum.textContent='Сонгогдсон: '+names.join(', ');
}
function getTargets(){
  const allCb=document.getElementById('targAll');
  if(!allCb||allCb.checked) return 'all';
  const checked=[...document.querySelectorAll('.targCb:checked')].map(c=>Number(c.value));
  return checked.length===0?'all':checked;
}
function toggleEv(){
  everyOn=!everyOn;
  const sw=document.getElementById('evSw'),sub=document.getElementById('evSub'),dw=document.getElementById('nDateW');
  if(everyOn){sw.classList.add('on','honn');sub.textContent='Идэвхтэй — өдөр бүр бүх ажилтанд харагдана';dw.style.display='none';}
  else{sw.classList.remove('on','honn');sub.textContent='Унтарсан — нэг удааны огноо сонгоно';dw.style.display='block';}
}

async function addInstr(){
  const txt=document.getElementById('nText').value.trim();
  const dt=everyOn?null:document.getElementById('nDate').value;
  const type=document.getElementById('nType').value;
  const targets=getTargets();
  if(!txt){showToast('Зааврын агуулга хоосон байна!');return;}
  if(!everyOn&&!dt){showToast('Огноо сонгоно уу!');return;}
  const{data,error}=await sb.from('instructions').insert({
    date:dt,everyday:everyOn,type,text:txt,
    targets:targets==='all'?'all':JSON.stringify(targets),
    created_by:CU.id
  }).select().single();
  if(error){showToast('Алдаа гарлаа: '+error.message);return;}
  everyOn=false;
  showToast('Заавар нийтлэгдлээ!',type==='habea'?'h':'g');
  navigate('add-instr');
}

async function delInstr(id){
  if(!confirm('Энэ зааврыг устгах уу?'))return;
  await sb.from('acknowledgements').delete().eq('instruction_id',id);
  await sb.from('instructions').delete().eq('id',id);
  showToast('Устгагдлаа');
  navigate(document.querySelector('.ni.active')?.id?.replace('nav-','')||'add-instr');
}

function eiTargAllChg(){
  const allCb=document.getElementById('eiTargAll');
  const list=document.getElementById('eiTargList');
  list.style.opacity=allCb.checked?'.4':'1';
  list.style.pointerEvents=allCb.checked?'none':'auto';
  if(allCb.checked) document.querySelectorAll('.eiTargCb').forEach(c=>c.checked=false);
}
function getEiTargets(){
  const allCb=document.getElementById('eiTargAll');
  if(!allCb||allCb.checked) return 'all';
  const checked=[...document.querySelectorAll('.eiTargCb:checked')].map(c=>Number(c.value));
  return checked.length===0?'all':checked;
}
function eiModeChg(){document.getElementById('eiDW').style.display=document.getElementById('eiMode').value==='every'?'none':'block';}
function openEI(id){
  const i=INSTRS.find(x=>x.id===id);if(!i)return;
  const ws=workers();
  document.getElementById('eiId').value=id;
  document.getElementById('eiType').value=i.type||'general';
  document.getElementById('eiMode').value=i.everyday?'every':'once';
  document.getElementById('eiDate').value=i.date||today();
  document.getElementById('eiText').value=i.text;
  const list=document.getElementById('eiTargList');
  list.innerHTML=activeWorkers().map(w=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0">
    <input type="checkbox" class="eiTargCb" value="${w.id}" style="accent-color:var(--accent);width:13px;height:13px;cursor:pointer">
    <span style="font-size:12px;color:var(--text)">${w.name}</span>
    ${w.profession?`<span style="font-size:10px;color:var(--text3)">· ${w.profession}</span>`:''}
  </label>`).join('');
  const allCb=document.getElementById('eiTargAll');
  const t=i.targets;
  if(!t||t==='all'){allCb.checked=true;list.style.opacity='.4';list.style.pointerEvents='none';}
  else{
    allCb.checked=false;list.style.opacity='1';list.style.pointerEvents='auto';
    const arr=Array.isArray(t)?t:(typeof t==='string'?JSON.parse(t):[]);
    document.querySelectorAll('.eiTargCb').forEach(c=>{c.checked=arr.includes(Number(c.value));});
  }
  eiModeChg();
  document.getElementById('eiModal').classList.add('open');
}
function closeEI(){document.getElementById('eiModal').classList.remove('open');}
async function saveEI(){
  const id=Number(document.getElementById('eiId').value);
  const type=document.getElementById('eiType').value;
  const every=document.getElementById('eiMode').value==='every';
  const dt=every?null:document.getElementById('eiDate').value;
  const txt=document.getElementById('eiText').value.trim();
  const targets=getEiTargets();
  if(!txt){showToast('Агуулга хоосон байна!');return;}
  const{error}=await sb.from('instructions').update({
    type,everyday:every,date:dt,text:txt,
    targets:targets==='all'?'all':JSON.stringify(targets)
  }).eq('id',id);
  if(error){showToast('Алдаа: '+error.message);return;}
  closeEI();showToast('Хадгалагдлаа!',type==='habea'?'h':'g');
  navigate(document.querySelector('.ni.active')?.id?.replace('nav-','')||'add-instr');
}

async function addUser(){
  const name=document.getElementById('nuNm').value.trim();
  const username=document.getElementById('nuUsr').value.trim();
  const password=document.getElementById('nuPw').value.trim();
  const profession=document.getElementById('nuProf').value.trim();
  const phone=document.getElementById('nuPhone').value.trim();
  const role=document.getElementById('nuRl').value;
  const err=document.getElementById('nuErr');
  if(!name||!username||!password){err.textContent='Нэр, нэвтрэх нэр, нууц үг шаардлагатай!';return;}
  const{error}=await sb.from('users').insert({name,username,password,role,profession,phone,on_leave:false});
  if(error){err.textContent=error.code==='23505'?'Нэвтрэх нэр аль хэдийн бүртгэлтэй!':'Алдаа: '+error.message;return;}
  err.textContent='';showToast(name+' нэмэгдлээ!','g');navigate('mu');
}
async function delUser(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  if(!confirm(u.name+'-г устгах уу?'))return;
  await sb.from('acknowledgements').delete().eq('user_id',id);
  await sb.from('users').delete().eq('id',id);
  showToast(u.name+' устгагдлаа');navigate('mu');
}
function openEU(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  document.getElementById('euId').value=id;
  document.getElementById('euNm').value=u.name;
  document.getElementById('euUsr').value=u.username;
  document.getElementById('euPw').value='';
  document.getElementById('euProf').value=u.profession||'';
  document.getElementById('euPhone').value=u.phone||'';
  document.getElementById('euRl').value=u.role;
  const _lv=document.getElementById('euLeave');if(_lv)_lv.checked=!!u.on_leave;
  document.getElementById('euErr').textContent='';
  document.getElementById('euModal').classList.add('open');
}
function closeEU(){document.getElementById('euModal').classList.remove('open');}
async function saveEU(){
  const id=Number(document.getElementById('euId').value);
  const name=document.getElementById('euNm').value.trim();
  const username=document.getElementById('euUsr').value.trim();
  const password=document.getElementById('euPw').value.trim();
  const profession=document.getElementById('euProf').value.trim();
  const phone=document.getElementById('euPhone').value.trim();
  const role=document.getElementById('euRl').value;
  const err=document.getElementById('euErr');
  if(!name||!username){err.textContent='Нэр болон нэвтрэх нэр шаардлагатай!';return;}
  const on_leave=!!(document.getElementById('euLeave')?.checked);
  const upd={name,username,role,profession,phone,on_leave};
  if(password) upd.password=password;
  const{error}=await sb.from('users').update(upd).eq('id',id);
  if(error){err.textContent='Алдаа: '+error.message;return;}
  if(CU.id===id){CU.name=name;CU.username=username;CU.role=role;}
  closeEU();showToast('Хадгалагдлаа!','g');navigate('mu');
}

// WORKER — TODAY (БҮХ ТӨРЛИЙН ЗААВАР)
// ============================================================
function rToday(){
  const uid=CU.id;

  // Өнөөдрийн БҮГД заавар (habea, urgent, general) — targMatch хангасан
  const todayInstrs=INSTRS.filter(i=>activeToday(i)&&targMatch(i,uid));

  // Аваагүй өмнөх заавар (reminder)
  const unread=INSTRS.filter(i=>!i.everyday&&!getAck(i,uid)&&targMatch(i,uid)&&!activeToday(i))
    .sort((a,b)=>(b.date||'9999').localeCompare(a.date||'9999'))[0];

  let html='';

  if(unread){
    html+=`<div class="w-alert">
      <div class="w-alert-ico">⚠️</div>
      <div style="flex:1;min-width:0">
        <div class="w-alert-title">Аваагүй заавар байна — ${unread.date||'Байнга'}</div>
        <div class="w-alert-sub">${unread.text.length>90?unread.text.slice(0,90)+'…':unread.text}</div>
      </div>
      <button onclick="navigate('history')"
        style="flex-shrink:0;padding:8px 14px;border-radius:8px;border:1px solid var(--abd);background:transparent;color:var(--amber);font-size:12px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;white-space:nowrap">
        Харах →
      </button>
    </div>`;
  }

  if(!todayInstrs.length){
    html+=`<div style="text-align:center;padding:60px 20px;color:var(--text3)">
      <div style="font-size:32px;margin-bottom:10px;opacity:.4">☀️</div>
      <div style="font-size:13px">Өнөөдрийн заавар байхгүй</div>
      <div style="font-size:11px;margin-top:4px;font-family:'IBM Plex Mono',monospace">${today()}</div>
    </div>`;
    return html;
  }

  // Яаралтай зааврыг эхэнд гаргах
  const urgent=todayInstrs.filter(i=>i.type==='urgent');
  const habea=todayInstrs.filter(i=>i.type==='habea');
  const general=todayInstrs.filter(i=>i.type==='general');
  const ordered=[...urgent,...habea,...general];

  if(urgent.length){
    html+=`<div class="wsec-hdr"><span class="wsec-lbl" style="color:var(--red)">🚨 Яаралтай</span><div class="wsec-line"></div></div>`;
    html+=urgent.map(i=>wCard(i,uid)).join('');
  }
  if(habea.length){
    html+=(urgent.length?'<div style="margin-top:8px"></div>':'')+`<div class="wsec-hdr"><span class="wsec-lbl" style="color:var(--hb)">🔷 HABEA</span><div class="wsec-line"></div></div>`;
    html+=habea.map(i=>wCard(i,uid)).join('');
  }
  if(general.length){
    html+=((urgent.length||habea.length)?'<div style="margin-top:8px"></div>':'')+`<div class="wsec-hdr"><span class="wsec-lbl" style="color:var(--text3)">Ерөнхий</span><div class="wsec-line"></div></div>`;
    html+=general.map(i=>wCard(i,uid)).join('');
  }

  return html;
}

let sigCanvas,sigCtx,isDrawing=false,hasSig=false,lastX=0,lastY=0;
function openSigM(id){
  pendingSigId=id;
  const i=INSTRS.find(x=>x.id===id);
  document.getElementById('sigSub').textContent=i?`"${i.text.slice(0,60)}${i.text.length>60?'…':''}"`:'' ;
  document.getElementById('sigModal').classList.add('open');
  setTimeout(initSP,80);
}
function initSP(){
  sigCanvas=document.getElementById('sigCanvas');
  const wrap=document.getElementById('sigWrap');
  sigCanvas.width=wrap.clientWidth;sigCanvas.height=140;
  sigCtx=sigCanvas.getContext('2d');
  sigCtx.strokeStyle='#ededf0';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';sigCtx.lineJoin='round';
  hasSig=false;document.getElementById('sigPh').style.display='block';
  sigCanvas.onmousedown=e=>{isDrawing=true;[lastX,lastY]=gp(e);};
  sigCanvas.onmousemove=e=>{if(!isDrawing)return;dr(e);};
  sigCanvas.onmouseup=()=>{isDrawing=false;sigCtx.beginPath();};
  sigCanvas.onmouseleave=()=>{isDrawing=false;sigCtx.beginPath();};
  sigCanvas.ontouchstart=e=>{e.preventDefault();isDrawing=true;[lastX,lastY]=gp(e.touches[0]);};
  sigCanvas.ontouchmove=e=>{e.preventDefault();if(!isDrawing)return;dr(e.touches[0]);};
  sigCanvas.ontouchend=()=>{isDrawing=false;sigCtx.beginPath();};
}
function gp(e){const r=sigCanvas.getBoundingClientRect();return[(e.clientX-r.left)*(sigCanvas.width/r.width),(e.clientY-r.top)*(sigCanvas.height/r.height)];}
function dr(e){const[x,y]=gp(e);sigCtx.beginPath();sigCtx.moveTo(lastX,lastY);sigCtx.lineTo(x,y);sigCtx.stroke();[lastX,lastY]=[x,y];if(!hasSig){hasSig=true;document.getElementById('sigPh').style.display='none';}}
function clearSig(){if(!sigCtx)return;sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);hasSig=false;document.getElementById('sigPh').style.display='block';}
function closeSig(){document.getElementById('sigModal').classList.remove('open');pendingSigId=null;}
async function confirmSig(){
  if(!hasSig){showToast('Гарын үсэг зурна уу!');return;}
  const sig=sigCanvas.toDataURL('image/png');
  const i=INSTRS.find(x=>x.id===pendingSigId);if(!i){closeSig();return;}
  const{error}=await sb.from('acknowledgements').upsert({
    instruction_id:i.id,
    user_id:CU.id,
    ack_date:today(),
    sig,
    signed_at:new Date().toISOString()
  },{onConflict:'instruction_id,user_id,ack_date'});
  if(error){showToast('Алдаа: '+error.message);return;}
  closeSig();showToast('Амжилттай баталгаажуулав!','g');
  navigate(document.querySelector('.ni.active')?.id?.replace('nav-','')||'today');
}
function viewSig(src,name){document.getElementById('svT').textContent=name+' — гарын үсэг';document.getElementById('svI').src=src;document.getElementById('sigVM').classList.add('open');}
function closeSV(){document.getElementById('sigVM').classList.remove('open');}
document.addEventListener('click',e=>{
  ['sigVM','sigModal','eiModal','euModal'].forEach(id=>{if(e.target===document.getElementById(id))document.getElementById(id).classList.remove('open');});
});

const XC = {
  // Header backgrounds
  H_NAVY:   '1E3A5F',   // Ерөнхий header — харанхуй цэнхэр
  H_PURPLE: '4C1D95',   // HABEA header — нил ягаан
  H_TEAL:   '134E4A',   // Ажилтан header — харанхуй ногоон
  H_COVER:  '0F172A',   // Нүүр хуудас header
  // Header text
  WHITE:    'FFFFFF',
  // Row colors
  ROW_EVEN: 'EFF6FF',   // Тэгш мөр — цайвар цэнхэр
  ROW_ODD:  'FFFFFF',   // Тэгш бус мөр — цагаан
  ROW_EV2:  'F5F3FF',   // HABEA тэгш — цайвар нил ягаан
  ROW_OD2:  'FAFAFA',
  ROW_EV3:  'ECFDF5',   // Ажилтан тэгш — цайвар ногоон
  // Status colors
  DONE_BG:  'DCFCE7',   DONE_FG:  '14532D',   // Авсан
  MISS_BG:  'FEE2E2',   MISS_FG:  '7F1D1D',   // Аваагүй
  PART_BG:  'FEF9C3',   PART_FG:  '713F12',   // Хэсэгчлэн
  FULL_BG:  'BBF7D0',   FULL_FG:  '14532D',   // 100%
  // Borders
  BORDER:   'CBD5E1',
  COVER_BG: '0F172A',
};

// ── Helpers ──────────────────────────────────────────────────
function xDate(str){
  if(!str) return null;
  const d=new Date(str+'T00:00:00');
  return isNaN(d)?null:d;
}
function xDT(signed_at,ack_date){
  if(signed_at){const d=new Date(signed_at);if(!isNaN(d))return d;}
  return xDate(ack_date);
}
function xW(data){
  if(!data||!data[0]) return [];
  return data[0].map((_,ci)=>{
    const maxW=data.reduce((m,row)=>{
      const v=row[ci] instanceof Date?16:(row[ci]!=null?String(row[ci]).length:0);
      return Math.max(m,v);
    },10);
    return {wch:Math.min(maxW+3,55)};
  });
}

// cell style shorthand
function cs(bgRgb,fgRgb,opts={}){
  return {
    fill:{patternType:'solid',fgColor:{rgb:bgRgb}},
    font:{color:{rgb:fgRgb},bold:!!opts.bold,sz:opts.sz||11,name:'Calibri'},
    alignment:{horizontal:opts.h||'left',vertical:'center',wrapText:!!opts.wrap},
    border:{
      top:{style:'thin',color:{rgb:XC.BORDER}},
      bottom:{style:'thin',color:{rgb:XC.BORDER}},
      left:{style:'thin',color:{rgb:XC.BORDER}},
      right:{style:'thin',color:{rgb:XC.BORDER}},
    }
  };
}

// Apply styles to a sheet
function applyStyles(sh, data, headerBg, evenBg, oddBg, dateColIdx, dtColIdx){
  const enc=XLSX.utils.encode_cell;
  const range=XLSX.utils.decode_range(sh['!ref']||'A1');
  const cols=range.e.c+1;

  for(let R=0;R<=range.e.r;R++){
    for(let C=0;C<=range.e.c;C++){
      const addr=enc({r:R,c:C});
      if(!sh[addr]) sh[addr]={v:'',t:'s'};
      const val=sh[addr].v;

      if(R===0){
        // Header мөр
        sh[addr].s=cs(headerBg,XC.WHITE,{bold:true,sz:11,h:'center'});
      } else {
        const bg=R%2===0?evenBg:oddBg;

        // Авсан/Аваагүй баганд conditional color
        if(val==='Авсан'){
          sh[addr].s=cs(XC.DONE_BG,XC.DONE_FG,{h:'center',bold:true});
        } else if(val==='Аваагүй'){
          sh[addr].s=cs(XC.MISS_BG,XC.MISS_FG,{h:'center',bold:true});
        } else if(val==='Тийм'){
          sh[addr].s=cs('DBEAFE','1E3A8A',{h:'center',bold:true});
        } else if(val==='Үгүй'){
          sh[addr].s=cs(oddBg,'64748B',{h:'center'});
        } else if(C===dateColIdx&&sh[addr].t==='d'){
          sh[addr].s=cs(bg,'334155',{h:'center'});
          sh[addr].z='yyyy/mm/dd';
        } else if(C===dtColIdx&&sh[addr].t==='d'){
          sh[addr].s=cs(bg,'334155',{h:'center'});
          sh[addr].z='yyyy/mm/dd hh:mm';
        } else if(typeof val==='number'){
          sh[addr].s=cs(bg,'1E3A5F',{h:'center',bold:C>3});
        } else {
          sh[addr].s=cs(bg,'334155',{wrap:C===3});
        }
      }
    }
  }
  // Толгой мөрийн өндөр
  if(!sh['!rows']) sh['!rows']=[];
  sh['!rows'][0]={hpx:24};
  // Freeze header row
  sh['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activeCell:'A2',sqref:'A2'};
}

// Хувь → conditional color (Ажилтан хуудас)
function applyPctColor(sh, pctCol, rowCount){
  const enc=XLSX.utils.encode_cell;
  for(let R=1;R<=rowCount;R++){
    const addr=enc({r:R,c:pctCol});
    if(!sh[addr]) continue;
    const v=sh[addr].v;
    if(typeof v!=='number') continue;
    const bg=v===100?XC.FULL_BG:v>=70?XC.DONE_BG:v>=40?XC.PART_BG:XC.MISS_BG;
    const fg=v===100?XC.FULL_FG:v>=70?XC.DONE_FG:v>=40?XC.PART_FG:XC.MISS_FG;
    sh[addr].s=cs(bg,fg,{h:'center',bold:true});
    sh[addr].v=v+'%';sh[addr].t='s';
  }
}

// ── Cover sheet ───────────────────────────────────────────────
function makeCoverSheet(ws_, hi){
  const now=new Date();
  const nowStr=now.toLocaleString('mn-MN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const onceI=INSTRS.filter(i=>!i.everyday);
  const evI=INSTRS.filter(i=>i.everyday);
  const totalAcks=ACKS.length;
  const oncePoss=onceI.length*ws_.length;
  const haAcks=hi.reduce((s,i)=>s+ws_.reduce((s2,w)=>s2+(getAck(i,w.id)?1:0),0),0);
  const hposs=hi.length*ws_.length;
  const pct=oncePoss?Math.round(ACKS.filter(a=>onceI.find(i=>i.id===a.instruction_id)).length/oncePoss*100):0;
  const hpct=hposs?Math.round(haAcks/hposs*100):0;

  const data=[
    ['B SOFT LLC — Workflow Тайлан',''],
    ['Гаргасан огноо:', nowStr],
    ['',''],
    ['ҮЗҮҮЛЭЛТ','УТГА'],
    ['Нийт ажилтан',ws_.length],
    ['Нийт заавар',INSTRS.length],
    ['  — Нэг удааны заавар',onceI.length],
    ['  — Өдөр бүрийн заавар',evI.length],
    ['  — HABEA заавар',hi.length],
    ['Нийт хүлээн авалт (нэг удааны)',ACKS.filter(a=>onceI.find(i=>i.id===a.instruction_id)).length+' / '+oncePoss],
    ['Нэг удааны хамрагдалт',pct+'%'],
    ['HABEA хамрагдалт',hpct+'%'],
    ['Өдөр бүрийн нийт авалт',ACKS.filter(a=>evI.find(i=>i.id===a.instruction_id)).length+' бичлэг'],
    ['Нийт гарын үсэг',ACKS.filter(a=>a.sig).length],
  ];

  const sh=XLSX.utils.aoa_to_sheet(data);
  sh['!cols']=[{wch:36},{wch:28}];
  if(!sh['!rows']) sh['!rows']=[];

  const enc=XLSX.utils.encode_cell;
  // Title
  sh['A1'].s=cs(XC.H_COVER,XC.WHITE,{bold:true,sz:16,h:'left'});
  sh['B1'].s=cs(XC.H_COVER,XC.WHITE,{sz:11});
  sh['!rows'][0]={hpx:40};

  // Subtitle row
  sh['A2'].s=cs('1E293B','94A3B8',{sz:10});
  sh['B2'].s=cs('1E293B','64DCFF',{sz:10,bold:true});
  sh['!rows'][1]={hpx:20};

  // Empty row
  sh['A3']={v:'',t:'s',s:cs('0F172A',XC.WHITE)};
  sh['B3']={v:'',t:'s',s:cs('0F172A',XC.WHITE)};

  // Table header row (row 4 = index 3)
  sh['A4'].s=cs(XC.H_NAVY,XC.WHITE,{bold:true,sz:11,h:'center'});
  sh['B4'].s=cs(XC.H_NAVY,XC.WHITE,{bold:true,sz:11,h:'center'});
  sh['!rows'][3]={hpx:22};

  // Data rows
  for(let r=4;r<data.length;r++){
    const even=r%2===0;
    const bg=even?'EFF6FF':'FFFFFF';
    const isMetric=r>=4;
    const addrA=enc({r,c:0}), addrB=enc({r,c:1});
    if(!sh[addrA]) sh[addrA]={v:'',t:'s'};
    if(!sh[addrB]) sh[addrB]={v:'',t:'s'};
    sh[addrA].s=cs(bg,'334155',{bold:false});

    // Value: color by content
    const vb=sh[addrB].v;
    if(typeof vb==='string'&&vb.includes('%')){
      const n=parseInt(vb);
      const vbg=n===100?XC.FULL_BG:n>=70?XC.DONE_BG:n>=40?XC.PART_BG:XC.MISS_BG;
      const vfg=n===100?XC.FULL_FG:n>=70?XC.DONE_FG:n>=40?XC.PART_FG:XC.MISS_FG;
      sh[addrB].s=cs(vbg,vfg,{bold:true,h:'center'});
    } else if(typeof vb==='number'){
      sh[addrB].s=cs(bg,'1E3A5F',{bold:true,h:'center'});
    } else {
      sh[addrB].s=cs(bg,'1E40AF',{bold:false,h:'center'});
    }
  }
  return sh;
}

// ── Main export ───────────────────────────────────────────────
function exportExcel(){
  try{
    const ws_=activeWorkers(); // амралтгүй ажилтнууд
    const hi=INSTRS.filter(i=>i.type==='habea');
    const onceI=INSTRS.filter(i=>!i.everyday);
    const evI=INSTRS.filter(i=>i.everyday);

    // ── Sheet 1: Нүүр / Хураангуй ────────────────────────────
    const coverSh=makeCoverSheet(ws_,hi);

    // ── Sheet 2: Дэлгэрэнгүй жагсаалт ───────────────────────
    const detRows=[['Заавар огноо','Төрөл','Өдөр бүр?','Зааврын агуулга','Ажилтан','Авсан эсэх','Авсан огноо цаг']];
    INSTRS.forEach(i=>{
      if(i.everyday){
        ws_.forEach(w=>{
          const history=getAckHistory(i,w.id);
          if(!history.length){
            detRows.push([null,tLabel(i.type),'Тийм',i.text,w.name,'Аваагүй',null]);
          } else {
            history.forEach(a=>{
              detRows.push([xDate(a.ack_date),tLabel(i.type),'Тийм',i.text,w.name,'Авсан',xDT(a.signed_at,a.ack_date)]);
            });
          }
        });
      } else {
        ws_.forEach(w=>{
          const ack=ACKS.find(a=>a.instruction_id===i.id&&a.user_id===Number(w.id));
          detRows.push([xDate(i.date),tLabel(i.type),'Үгүй',i.text,w.name,ack?'Авсан':'Аваагүй',ack?xDT(ack.signed_at,ack.ack_date):null]);
        });
      }
    });
    const detSh=XLSX.utils.aoa_to_sheet(detRows,{cellDates:true});
    detSh['!cols']=xW(detRows);
    detSh['!cols'][3]={wch:52}; // агуулга — өргөн
    applyStyles(detSh,detRows,XC.H_NAVY,XC.ROW_EVEN,XC.ROW_ODD,0,6);

    // ── Sheet 3: HABEA тайлан ─────────────────────────────────
    const hdetRows=[['Огноо','HABEA зааврын агуулга','Ажилтан','Авсан эсэх','Авсан огноо цаг']];
    hi.forEach(i=>{
      if(i.everyday){
        ws_.forEach(w=>{
          const history=getAckHistory(i,w.id);
          if(!history.length){
            hdetRows.push([null,i.text,w.name,'Аваагүй',null]);
          } else {
            history.forEach(a=>{
              hdetRows.push([xDate(a.ack_date),i.text,w.name,'Авсан',xDT(a.signed_at,a.ack_date)]);
            });
          }
        });
      } else {
        ws_.forEach(w=>{
          const ack=ACKS.find(a=>a.instruction_id===i.id&&a.user_id===Number(w.id));
          hdetRows.push([xDate(i.date),i.text,w.name,ack?'Авсан':'Аваагүй',ack?xDT(ack.signed_at,ack.ack_date):null]);
        });
      }
    });
    const hdetSh=XLSX.utils.aoa_to_sheet(hdetRows,{cellDates:true});
    hdetSh['!cols']=xW(hdetRows);
    hdetSh['!cols'][1]={wch:52};
    applyStyles(hdetSh,hdetRows,XC.H_PURPLE,XC.ROW_EV2,XC.ROW_OD2,0,4);

    // ── Sheet 4: Ажилтан хураангуй ───────────────────────────
    const wsumRows=[['Ажилтан','Нэвтрэх нэр','Мэргэжил','Утас','Нийт заавар','Авсан','Аваагүй','Хувь (%)','HABEA авсан','HABEA нийт','Гарын үсэг']];
    ws_.forEach(w=>{
      const tk=INSTRS.reduce((s,i)=>s+(ACKS.some(a=>a.instruction_id===i.id&&a.user_id===Number(w.id))?1:0),0);
      const htk=hi.reduce((s,i)=>s+(ACKS.some(a=>a.instruction_id===i.id&&a.user_id===Number(w.id))?1:0),0);
      const sigCnt=ACKS.filter(a=>a.user_id===Number(w.id)&&a.sig).length;
      wsumRows.push([
        w.name,w.username,w.profession||'',w.phone||'',
        INSTRS.length,tk,INSTRS.length-tk,
        INSTRS.length?Math.round(tk/INSTRS.length*100):0,
        htk,hi.length,sigCnt
      ]);
    });
    const wsumSh=XLSX.utils.aoa_to_sheet(wsumRows,{cellDates:true});
    wsumSh['!cols']=xW(wsumRows);
    applyStyles(wsumSh,wsumRows,XC.H_TEAL,XC.ROW_EV3,XC.ROW_ODD,-1,-1);
    applyPctColor(wsumSh,7,wsumRows.length-1); // Хувь (%) багана

    // ── Sheet 5: Өдрийн дүн (сүүлийн 30 өдөр) ───────────────
    const evDates=[...new Set(ACKS.filter(a=>evI.find(i=>i.id===a.instruction_id)).map(a=>a.ack_date))]
      .sort((a,b)=>b.localeCompare(a)).slice(0,30);
    const dayRows=[['Огноо','Нийт боломжит','Авсан','Аваагүй','Хувь (%)']];
    evDates.forEach(date=>{
      const dayAcks=ACKS.filter(a=>a.ack_date===date&&evI.find(i=>i.id===a.instruction_id));
      const poss=evI.length*ws_.length;
      const missed=poss-dayAcks.length;
      const pct=poss?Math.round(dayAcks.length/poss*100):0;
      dayRows.push([xDate(date),poss,dayAcks.length,missed,pct]);
    });
    const daySh=XLSX.utils.aoa_to_sheet(dayRows,{cellDates:true});
    daySh['!cols']=[{wch:16},{wch:18},{wch:12},{wch:12},{wch:12}];
    applyStyles(daySh,dayRows,'0E7490','E0F2FE','FFFFFF',0,-1);
    applyPctColor(daySh,4,dayRows.length-1);

    // ── Workbook ─────────────────────────────────────────────
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,coverSh,'📊 Хураангуй');
    XLSX.utils.book_append_sheet(wb,detSh,'📋 Дэлгэрэнгүй');
    XLSX.utils.book_append_sheet(wb,hdetSh,'🔷 HABEA');
    XLSX.utils.book_append_sheet(wb,wsumSh,'👥 Ажилтан');
    XLSX.utils.book_append_sheet(wb,daySh,'📅 Өдрийн дүн');

    const fname=`BSOFT_Тайлан_${today()}.xlsx`;
    XLSX.writeFile(wb,fname,{cellDates:true,bookSST:false});
    showToast('📥 '+fname+' татагдлаа','g');
  } catch(e){
    console.error('Excel export error:',e);
    showToast('Excel алдаа: '+e.message);
  }
}
// ============================================================
// PAGINATION
// ============================================================
function pagCtrl(cur,total,varName,page,tot){
  if(total<=1)return '';
  const w=Math.min(total,7);let s=Math.max(1,cur-3),e=Math.min(total,s+w-1);
  if(e-s<w-1)s=Math.max(1,e-w+1);
  let b='';
  if(s>1)b+=`<button class="pb" onclick="${varName}=1;navigate('${page}')">1</button>${s>2?'<span style="color:var(--text3);font-size:10px;padding:0 2px">…</span>':''}`;
  for(let p=s;p<=e;p++)b+=`<button class="pb${p===cur?' cur':''}" onclick="${varName}=${p};navigate('${page}')">${p}</button>`;
  if(e<total)b+=`${e<total-1?'<span style="color:var(--text3);font-size:10px;padding:0 2px">…</span>':''}<button class="pb" onclick="${varName}=${total};navigate('${page}')">${total}</button>`;
  return `<div class="pag">
    ${cur>1?`<button class="pb" onclick="${varName}=${cur-1};navigate('${page}')">←</button>`:''}
    ${b}
    ${cur<total?`<button class="pb" onclick="${varName}=${cur+1};navigate('${page}')">→</button>`:''}
    <span class="pinfo">${(cur-1)*WPP+1}–${Math.min(cur*WPP,tot)} / ${tot}</span>
  </div>`;
}
